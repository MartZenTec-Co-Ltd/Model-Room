name: Windows standalone build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build dependency
        run: python -m pip install -r requirements.txt
      - name: Build self-contained Windows EXE
        shell: powershell
        run: .\build-windows.ps1
      - name: Test EXE with no Python on PATH
        shell: powershell
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONHOME = 'C:\modelroom-deliberately-missing-python'
          $env:PYTHONPATH = 'C:\modelroom-deliberately-missing-modules'
          $report = Join-Path $PWD 'selftest-ci.json'
          $app = Start-Process -FilePath (Join-Path $PWD 'dist\ModelRoom.exe') -ArgumentList @('--self-test', ('"' + $report + '"')) -WindowStyle Hidden -PassThru
          $null = $app.Handle
          if (-not $app.WaitForExit(120000)) { $app.Kill(); throw 'EXE diagnostic timed out.' }
          if ($app.ExitCode -ne 0) { throw 'EXE diagnostic failed.' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'EXE diagnostic report failed.' }
          $result | ConvertTo-Json -Depth 5
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ModelRoom-Windows-x64
          path: dist/ModelRoom.exe
          if-no-files-found: error
